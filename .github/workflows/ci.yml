name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - development
      - dev
      - develop
      - uat
      - qa
  pull_request:
    branches:
      - main
      - master
      - development
      - dev
      - develop
      - uat
      - qa

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, bcmath
          coverage: xdebug

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text

      - name: Check coverage threshold
        run: |
          COVERAGE=$(php -r "
            \$xml = simplexml_load_file('coverage.xml');
            \$metrics = \$xml->project->metrics;
            \$lines = (int)\$metrics['coveredstatements'];
            \$total = (int)\$metrics['statements'];
            if (\$total > 0) {
              \$coverage = (\$lines / \$total) * 100;
              echo number_format(\$coverage, 2);
            } else {
              echo '0';
            }
          ")
          echo "Code coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 50% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets 50% threshold"

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress

  linting:
    name: Code Linting (Laravel Pint)
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint (test mode)
        run: vendor/bin/pint --test

  deploy-simulation:
    name: Deploy Simulation
    runs-on: ubuntu-latest
    needs: [tests, static-analysis, linting]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/qa')
    
    environment:
      name: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' && 'production' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/qa' && 'uat' || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "env_file=.env.prod" >> $GITHUB_OUTPUT
            echo "env_display=PRODUCTION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]] || [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "env_name=uat" >> $GITHUB_OUTPUT
            echo "env_file=.env.uat" >> $GITHUB_OUTPUT
            echo "env_display=UAT" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "env_file=.env.dev" >> $GITHUB_OUTPUT
            echo "env_display=DEVELOPMENT" >> $GITHUB_OUTPUT
          fi

      - name: Simulate deployment
        run: |
          echo "🚀 Deploying to ${{ steps.env.outputs.env_display }} with ${{ steps.env.outputs.env_file }}"
          cp ${{ steps.env.outputs.env_file }} .env
          echo "✅ Deployment to ${{ steps.env.outputs.env_display }} completed successfully"
          cat .env | head -5

  notify:
    name: Notify Maintainers
    runs-on: ubuntu-latest
    needs: [tests, static-analysis, linting, deploy-simulation]
    if: always()
    
    steps:
      - name: Prepare notification
        run: |
          if [[ "${{ needs.tests.result }}" == "success" ]] && [[ "${{ needs.static-analysis.result }}" == "success" ]] && [[ "${{ needs.linting.result }}" == "success" ]]; then
            echo "STATUS=✅ SUCCESS" >> $GITHUB_ENV
            echo "MESSAGE=All pipeline steps completed successfully!" >> $GITHUB_ENV
          else
            echo "STATUS=❌ FAILURE" >> $GITHUB_ENV
            echo "MESSAGE=Pipeline failed. Check the logs for details." >> $GITHUB_ENV
          fi

      - name: Display notification
        run: |
          echo "================================================"
          echo "Pipeline Status: ${{ env.STATUS }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Message: ${{ env.MESSAGE }}"
          echo "================================================"
          echo "Tests: ${{ needs.tests.result }}"
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "Linting: ${{ needs.linting.result }}"
          echo "Deploy Simulation: ${{ needs.deploy-simulation.result }}"
          echo "================================================"

      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ env.STATUS }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            ${{ env.MESSAGE }}
            
            📊 Pipeline Results:
            • Tests: ${{ needs.tests.result }}
            • Static Analysis: ${{ needs.static-analysis.result }}
            • Linting: ${{ needs.linting.result }}
            • Deploy: ${{ needs.deploy-simulation.result }}
            
            🔗 Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
